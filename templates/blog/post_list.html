{% extends 'blog/base.html' %}
{% block title %}HRSH{% endblock %}
{% block content %}
<div style="position: relative;">
    <h1 style="text-align: center; margin-bottom: 30px; font-size: 3rem;">MyBlog</h1>
    <span class="annotation annotation-arrow" style="top: -20px; right: 20%; transform: rotate(10deg); color: var(--ha-blue);">Read these!</span>
</div>
<div class="post-grid">
    {% for post in posts %}
    <div class="manga-panel post-card">
        <h2>{{post.title}}</h2>
        <img src="{{post.cover_image.url}}" alt="{{post.title}}">
        <p style="margin-bottom: 20px;">{{post.content|striptags|truncatewords:30}}</p>
        <a href="{% url 'post_details' post.slug %}" class="btn-action">Read More</a>
    </div>
    {% empty %}
    <div class="manga-panel">
        <h2>No logs found in the database.</h2>
    </div>
    {% endfor %}
</div>
{% endblock %}

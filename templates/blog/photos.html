{% extends 'blog/base.html' %}

{% block content %}
<style>
    .photo-gallery {
        column-count: 3;
        column-gap: 15px;
    }
    .photo {
        break-inside: avoid;
        margin-bottom: 15px;
        overflow: hidden;
        border-radius: 8px; /* Optional: makes it look a bit nicer */
    }
    .photo img {
        width: 100%;
        display: block;
        transition: transform 0.3s ease;
    }
    .photo:hover img {
        transform: scale(1.2); /* 20% bigger */
    }
</style>

<h1>Photos</h1>
<div class="photo-gallery">
{% for photo in photos %}
<div class="photo">
    <img src="{{photo.image.url}}" alt="{{photo.caption}}">
    <p>{{photo.caption}}</p>
</div>
{% empty %}
<h2>No photos found</h2>
{% endfor %}
</div>
{% endblock %}
